<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Student Performance Prediction</h2>

    <label>Attendance (%)</label>
    <input type="number" id="attendance">

    <label>Internal Marks (%)</label>
    <input type="number" id="marks">

    <label>Study Hours per Day</label>
    <input type="number" id="hours">

    <button onclick="predict()">Predict Performance</button>

    <div id="result"></div>

</div>

<script>

function predict() {

    let attendance = Number(document.getElementById("attendance").value);
    let marks = Number(document.getElementById("marks").value);
    let hours = Number(document.getElementById("hours").value);

    // Simple prediction rule
    let score = 0;

    if (attendance >= 75)
        score++;

    if (marks >= 50)
        score++;

    if (hours >= 2)
        score++;

    let result = document.getElementById("result");

    if (score >= 2) {

        result.innerHTML =
            "Prediction: GOOD PERFORMANCE<br>" +
            "Student is likely to PASS.";

    } else {

        result.innerHTML =
            "Prediction: NEEDS IMPROVEMENT<br>" +
            "Student is at risk of FAILING.";
    }
}

</script>

</body>
</html>
